# electron-builder packages compiled app + resources; it does NOT bundle the optional
# CloakBrowser Chromium binary (downloaded at runtime to the user/cache when enabled in Settings).
appId: com.ytdownload.app
productName: V-Download
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
extraResources:
  - from: extension
    to: extension
    filter:
      - "**/*"
protocols:
  - name: V-Download
    schemes:
      - ytdl
      # Browser extension cold-start uses vdownload://wake so macOS does not hand
      # ytdl:// to a stray node_modules Electron.app from local dev runs.
      - vdownload
mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  extendInfo:
    CFBundleDisplayName: V-Download
  target:
    - dmg
    - zip
win:
  icon: resources/icon.png
  target:
    - nsis
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
