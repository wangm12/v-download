# electron-builder packages compiled app + resources; it does NOT bundle the optional
# CloakBrowser Chromium binary (downloaded at runtime to the user/cache when enabled in Settings).
# Historical bundle id — changing it breaks updates and Gatekeeper identity.
appId: com.ytdownload.app
productName: V-Download
# build-mac-release.mjs performs the target Electron rebuild explicitly.
npmRebuild: false
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  # Engine binaries are staged per target architecture by build-mac-release.mjs.
  - '!resources/engines/**/*'
extraResources:
  - from: extension
    to: extension
    filter:
      - "**/*"
  # Created by build-mac-release.mjs from the signed release configuration.
  # Packaged builds fail closed if this fixed Chrome Web Store ID is absent.
  - from: .release-staging/current/extension-config.json
    to: extension-config.json
  - from: .release-staging/current/engines
    to: engines
    filter:
      - "**/*"
asar: true
afterPack: ./scripts/after-pack.mjs
mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  extendInfo:
    CFBundleDisplayName: V-Download
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # Release verification runs spctl again against the final artifact; keep builder assessment enabled.
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
protocols:
  - name: V-Download
    schemes:
      - ytdl
      # Browser extension cold-start uses vdownload://wake so macOS does not hand
      # ytdl:// to a stray node_modules Electron.app from local dev runs.
      - vdownload
# Win/Linux stanzas are unused. Shipping is macOS-only (`npm run build:mac*`).
win:
  icon: resources/icon.png
  target:
    - nsis
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
