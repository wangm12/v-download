# electron-builder packages compiled app + resources; it does NOT bundle the optional
# CloakBrowser Chromium binary (downloaded at runtime to the user/cache when enabled in Settings).
# Historical bundle id — changing it breaks updates and Gatekeeper identity.
appId: com.ytdownload.app
productName: V-Download
# Release wrappers verify the target Electron and N-API SQLite runtime before packaging.
npmRebuild: false
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - resources/**/*
  # Engine binaries are staged per target architecture by build-mac-release.mjs.
  - '!resources/engines/**/*'
extraResources:
  - from: extension
    to: extension
    filter:
      - "**/*"
  # Created by build-mac-release.mjs from the signed release configuration.
  # Packaged builds fail closed if the configured Chrome extension ID is absent.
  - from: .release-staging/current/extension-config.json
    to: extension-config.json
  - from: .release-staging/current/engines
    to: engines
    filter:
      - "**/*"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/**/*.node
afterPack: ./scripts/after-pack.mjs
mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  minimumSystemVersion: '12.0'
  extendInfo:
    CFBundleDisplayName: V-Download
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # Release verification runs spctl again against the final artifact; keep builder assessment enabled.
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
protocols:
  - name: V-Download
    schemes:
      - ytdl
      # Browser extension cold-start uses vdownload://wake so macOS does not hand
      # ytdl:// to a stray node_modules Electron.app from local dev runs.
      - vdownload
# Shipping targets: macOS (`npm run build:mac*`), Linux (`npm run build:linux*`).
win:
  icon: resources/icon.png
  target:
    - nsis
linux:
  maintainer: V-Download Contributors <support@v-download.app>
  icon: resources/icon.png
  category: Utility
  synopsis: Downie-style video downloader for YouTube, Douyin, and any website
  description: A video downloader powered by yt-dlp
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: V-Download
      Comment: Downie-style video downloader
      Keywords: download;video;youtube;douyin;
      StartupWMClass: v-download
      MimeType: x-scheme-handler/ytdl;x-scheme-handler/vdownload;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - 'libasound2t64 | libasound2'
