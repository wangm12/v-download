# Build macOS (DMG/zip) and Linux (deb/AppImage) installers and publish to GitHub Releases.
#
# Release is triggered ONLY when a version tag `v*` is pushed (via `make release`)
# or manually triggered via workflow_dispatch. Normal commits on main will NOT trigger releases.
#
# Optional secrets:
#   CHROME_EXTENSION_ID          32-char Chrome extension id (a-p)
#   CSC_LINK                     base64-encoded Developer ID .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple ID used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID                Developer Team ID

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require tag to match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Write release-config.json
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          node --input-type=module -e '
            const id = (process.env.CHROME_EXTENSION_ID || "").trim() || "abcdefghijklmnopabcdefghijklmnop"
            const { writeFileSync } = await import("node:fs")
            writeFileSync("release-config.json", `${JSON.stringify({
              updater: { provider: "generic", metadata: "" },
              chrome: { extensionId: id }
            }, null, 2)}\n`)
          '

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache fetched engines
        id: engines-cache
        uses: actions/cache@v4
        with:
          path: |
            resources/engines/darwin-${{ matrix.arch }}
            resources/engines/po-token/darwin-${{ matrix.arch }}
          key: engines-${{ matrix.arch }}-${{ hashFiles('resources/engines/manifest.json', 'resources/engines/metadata.json', 'resources/engines/SHA256SUMS') }}

      - name: Fetch engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: npm run fetch:engines
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          BUILD_ID: ${{ github.sha }}

      - name: Verify cached engines
        if: steps.engines-cache.outputs.cache-hit == 'true'
        run: npm run verify:engines
        env:
          RELEASE_ARCH: ${{ matrix.arch }}

      - name: Package macOS ${{ matrix.arch }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npm run build:mac:${{ matrix.arch }}
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID || 'abcdefghijklmnopabcdefghijklmnop' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  build-linux:
    name: Linux x64 (deb & AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Linux release
        run: npm run build:linux:x64
        env:
          RELEASE_ARCH: x64
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID || 'abcdefghijklmnopabcdefghijklmnop' }}

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.AppImage

  release:
    name: Publish Release
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge latest-mac.yml
        run: |
          if [ -f artifacts/macos-arm64/latest-mac.yml ] && [ -f artifacts/macos-x64/latest-mac.yml ]; then
            mkdir -p combined
            node scripts/merge-latest-mac.mjs --out combined/latest-mac.yml \
              artifacts/macos-arm64/latest-mac.yml \
              artifacts/macos-x64/latest-mac.yml
          fi

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          mkdir -p release-files
          shopt -s nullglob
          for f in artifacts/macos-*/*.dmg artifacts/macos-*/*.zip artifacts/macos-*/*.blockmap combined/*.yml artifacts/linux-*/*.deb artifacts/linux-*/*.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" release-files/
            fi
          done

          files=(release-files/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found to publish"
            exit 1
          fi

          echo "Files to upload:"
          ls -lh release-files/

          # Stable tag release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Updating release $tag..."
              gh release upload "$tag" "${files[@]}" --clobber
            else
              echo "Creating release $tag..."
              tag_msg="$(git tag -l --format='%(contents)' "$tag" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              custom_notes="$(echo "$tag_msg" | grep -v "^Release v" || true)"
              if [ -n "$custom_notes" ]; then
                gh release create "$tag" "${files[@]}" \
                  --title "V-Download ${tag#v}" \
                  --notes "$tag_msg" \
                  --verify-tag
              else
                gh release create "$tag" "${files[@]}" \
                  --title "V-Download ${tag#v}" \
                  --generate-notes \
                  --verify-tag
              fi
            fi
            exit 0
          fi

          # Rolling nightly pre-release
          notes="Nightly rolling build from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}."
          if gh release view nightly >/dev/null 2>&1; then
            echo "Updating existing nightly release..."
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly \
              --title "V-Download nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          else
            echo "Creating initial nightly release..."
            gh release create nightly "${files[@]}" \
              --title "V-Download nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
