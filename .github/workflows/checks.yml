# Build and type checks. Packaging, signing, and engine fetch stay on release.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall installs Electron and builds shared contracts.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
