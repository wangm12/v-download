# Fast contract suite. Packaging, signing, and engine fetch stay on release.yml.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall rebuilds better-sqlite3 for Electron. npm pretest restores
      # the host Node ABI so test:foundation can load the native module.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
