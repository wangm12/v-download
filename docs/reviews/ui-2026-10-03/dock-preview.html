<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>V-Download Dock visual preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f6;font:13px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.preview{padding:24px;width:530px;background:#15161a;border-radius:12px}h1{font-size:15px;margin:0 0 8px;font-weight:600}.hint{font-size:12px;color:#a4a9b4;margin:0 0 22px}.examples{display:flex;justify-content:space-around;gap:30px}.state{width:120px;text-align:center}.icon{position:relative;width:104px;height:104px;margin:auto}.icon img{width:100%;height:100%}.badge{position:absolute;right:2px;top:2px;background:#ff3b30;color:white;min-width:25px;height:25px;padding:0 6px;border-radius:20px;font-size:14px;font-weight:600;line-height:25px}.progress{position:absolute;height:5px;width:72px;left:16px;bottom:1px;border:1px solid #717785;border-radius:5px;background:#1c1f25;overflow:hidden}.progress span{height:100%;display:block;background:#dbe3f6}.label{margin:14px 0 0;color:#a4a9b4;font-size:12px}.note{margin:22px 0 0;color:#a4a9b4;font-size:11px;line-height:1.6;border-top:1px solid #292d35;padding-top:12px}
</style><main class="preview"><h1>Dock 图标与状态预览</h1><p class="hint">静态箭头 · 系统进度条 + 任务数角标</p><div class="examples"><div class="state"><div class="icon"><img src="../../../src/renderer/public/app-icon.png"></div><p class="label">已完成 · 清空状态</p></div><div class="state"><div class="icon"><img src="../../../src/renderer/public/app-icon.png"><span class="badge">2</span><div class="progress"><span style="width:45%"></span></div></div><p class="label">2 个任务 · 45%</p></div><div class="state"><div class="icon"><img src="../../../src/renderer/public/app-icon.png"><span class="badge">99+</span><div class="progress"><span style="width:72%"></span></div></div><p class="label">超过 99 个任务</p></div></div><p class="note">此图为状态示意。应用使用原生 macOS 进度条和角标；实际样式由系统绘制。</p></main></html>
